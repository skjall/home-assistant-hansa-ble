name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "LICENSE"
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # Platinum tier: strict typing, so nothing less than strict here.
      - name: Install dependencies
        run: pip install mypy pytest-homeassistant-custom-component

      - name: Type check
        run: mypy --strict --ignore-missing-imports custom_components/hansa_ble

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # pytest-homeassistant-custom-component brings Home Assistant, but not
      # the requirements of the bluetooth component it pulls in.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run pytest
        run: |
          mkdir -p .artefakte
          pytest --cov-report="json:.artefakte/coverage.json"

      - name: Enforce the coverage the claimed tier requires
        run: python scripts/check_coverage.py

  quality-scale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install pyyaml

      # The tier is only worth something if the code still holds it.
      - name: Check quality_scale.yaml against the code
        run: python scripts/check_quality_scale.py

  protocol-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Build and test the protocol package
        working-directory: lib/hansa_ble_protocol
        run: |
          python -m pip install --upgrade pip build pytest
          python -m build
          pip install dist/*.whl
          pytest -c pyproject.toml tests/

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate with hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate for HACS
        uses: hacs/action@main
        with:
          category: integration
          ignore: brands
