name: Publish protocol package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Build the distribution
        working-directory: lib/hansa_ble_protocol
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: lib/hansa_ble_protocol/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted Publishing: PyPI trusts this workflow, so no token is stored
      # anywhere. The trust is configured once, on pypi.org.
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
