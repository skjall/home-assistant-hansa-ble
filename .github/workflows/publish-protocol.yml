name: Publish protocol package (manual)

# Manual only. Releases publish through release.yml; a tag trigger cannot
# work here, because release-please creates its tag with the GITHUB_TOKEN and
# such tags do not start workflows.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or branch to build from"
        required: true
        default: main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Build the distribution
        working-directory: lib/hansa_ble_protocol
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: lib/hansa_ble_protocol/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted Publishing: PyPI trusts this workflow, so no token is stored
      # anywhere. The trust is configured once, on pypi.org.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
