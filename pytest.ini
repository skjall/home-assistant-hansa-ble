[pytest]
asyncio_mode = auto
testpaths = tests
# The test script redirects the JSON report to .artefakte/; only what always
# applies lives here. Silver wants more than 95%, the config flow all of it -
# scripts/check_coverage.py enforces the per-module floors.
addopts =
    --cov=custom_components.hansa_ble
    --cov-report=term-missing
    --cov-fail-under=95
